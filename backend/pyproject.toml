[project]
name = "wind-procurement-api"
version = "0.2.0"
requires-python = ">=3.14,<3.15"
description = "January 2026 GB wind procurement pilot API"
# Keep these pins identical to requirements.txt. Vercel installs this list.
# The Docker image installs requirements.txt.
dependencies = [
  "annotated-doc==0.0.5",
  "annotated-types==0.8.0",
  "anyio==4.15.1",
  "click==8.5.0",
  "fastapi==0.162.0",
  "certifi==2026.10.23",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "idna==3.20",
  "opentelemetry-api==1.45.1",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "pydantic_core==2.50.1",
  "python-dotenv==1.2.4",
  "starlette==1.10.0",
  "typing-inspection==0.4.4",
  "typing_extensions==4.16.0",
  "tzdata==2026.5",
  "uvicorn==0.54.0",
]

[tool.vercel]
entrypoint = "app.main:app"
